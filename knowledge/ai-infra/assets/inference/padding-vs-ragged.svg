<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Padding and ragged packing represent the same sequences</title>
<desc id="desc">Padded rows use nine slots while ragged packing uses six tokens with cumulative offsets 0,3,4,6. A causal block-diagonal attention mask permits attention only within the same request and to preceding positions.</desc>
<metadata>Original explanatory diagram for research-vault. References: https://docs.pytorch.org/tutorials/intermediate/variable_length_attention_tutorial.html ; https://docs.flashinfer.ai/tutorials/kv_layout.html</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52637A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F2F4F7"/><path d="M0,8 L8,0" stroke="#D5DDE6" stroke-width="1"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172B43} .mono{font-family:Menlo,Consolas,monospace}</style>
