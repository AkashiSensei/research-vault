<text x="345" y="536" font-size="21" style="fill:#172B43" font-weight="700" text-anchor="start">Example: causal self-attention on the packed tokens</text>
<text x="345" y="576" font-size="19" style="fill:#172B43" font-weight="400" text-anchor="start">Rows are queries; columns are keys. Colored cells are allowed.</text>
<text x="345" y="611" font-size="19" style="fill:#172B43" font-weight="400" text-anchor="start">C2 can attend to C1 and C2, but cannot attend to A or B.</text>
<text x="345" y="646" font-size="19" style="fill:#172B43" font-weight="400" text-anchor="start">A causal mask is still needed after padding is removed.</text>
<text x="40" y="752" font-size="17" style="fill:#52637A" font-weight="400" text-anchor="start">For decode, query and KV lengths can differ; use separate boundary metadata for each.</text>
