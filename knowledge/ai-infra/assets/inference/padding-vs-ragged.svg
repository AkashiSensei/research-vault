<text x="40" y="49" font-size="30" style="fill:#172B43" font-weight="700" text-anchor="start">Padding and ragged packing represent the same sequences</text>
<text x="40" y="83" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="start">Example sequence lengths: A = 3, B = 1, C = 2. Token labels retain their request identity.</text>
