<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Continuous batching refills a slot at iteration boundaries</title>
<desc id="desc">Two decode schedules show C starting at iteration 5 in a fixed batch and iteration 3 with continuous batching. All iterations are drawn equally wide as a schematic, not a latency measurement.</desc>
<metadata>Original explanatory diagram for research-vault. References: Orca, https://www.usenix.org/system/files/osdi22-yu.pdf</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52637A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F2F4F7"/><path d="M0,8 L8,0" stroke="#D5DDE6" stroke-width="1"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172B43} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#FFFFFF" stroke="none"/>
<text x="40" y="49" font-size="30" style="fill:#172B43" font-weight="700" text-anchor="start">Continuous batching refills a slot at iteration boundaries</text>
<text x="40" y="83" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="start">A needs 4 decode steps; B and C need 2 each. C is ready before iteration 3. Capacity: 2 requests.</text>
<line x1="40" y1="106" x2="1160" y2="106" stroke="#CFD8E3" stroke-width="2"/>
<text x="40" y="154" font-size="23" style="fill:#172B43" font-weight="700" text-anchor="start">Request-level batch: wait until A finishes</text>
<text x="250" y="192" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">1</text>
<text x="398" y="192" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">2</text>
<text x="546" y="192" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">3</text>
<text x="694" y="192" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">4</text>
<text x="842" y="192" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">5</text>
<text x="990" y="192" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">6</text>
<text x="40" y="192" font-size="18" style="fill:#52637A" font-weight="400" text-anchor="start">Iteration</text>
<text x="40" y="243" font-size="20" style="fill:#172B43" font-weight="400" text-anchor="start">Slot 1</text>
<rect x="184" y="210" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="250.0" y="242.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A1</text>
<rect x="332" y="210" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="398.0" y="242.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A2</text>
<rect x="480" y="210" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="546.0" y="242.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A3</text>
<rect x="628" y="210" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="694.0" y="242.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A4</text>
<rect x="776" y="210" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="842.0" y="242.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<rect x="924" y="210" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="990.0" y="242.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<text x="40" y="308" font-size="20" style="fill:#172B43" font-weight="400" text-anchor="start">Slot 2</text>
<rect x="184" y="275" width="132" height="50" rx="8" fill="#FCE4C4" stroke="#CFD8E3"/>
<text x="250.0" y="307.35" font-size="21" style="fill:#925000" font-weight="400" text-anchor="middle">B1</text>
<rect x="332" y="275" width="132" height="50" rx="8" fill="#FCE4C4" stroke="#CFD8E3"/>
<text x="398.0" y="307.35" font-size="21" style="fill:#925000" font-weight="400" text-anchor="middle">B2</text>
<rect x="480" y="275" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="546.0" y="307.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<rect x="628" y="275" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="694.0" y="307.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<rect x="776" y="275" width="132" height="50" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="842.0" y="307.35" font-size="21" style="fill:#18735C" font-weight="400" text-anchor="middle">C1</text>
<rect x="924" y="275" width="132" height="50" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="990.0" y="307.35" font-size="21" style="fill:#18735C" font-weight="400" text-anchor="middle">C2</text>
<line x1="472" y1="199" x2="472" y2="336" stroke="#18735C" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="358" font-size="17" style="fill:#18735C" font-weight="400" text-anchor="start">C ready</text>
<line x1="482" y1="328" x2="770" y2="328" stroke="#18735C" stroke-width="2" marker-end="url(#arrow)"/>
<text x="630" y="358" font-size="17" style="fill:#18735C" font-weight="400" text-anchor="start">waits for batch completion</text>
<text x="40" y="411" font-size="23" style="fill:#172B43" font-weight="700" text-anchor="start">Iteration-level batch: C reuses B’s slot</text>
<text x="250" y="449" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">1</text>
<text x="398" y="449" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">2</text>
<text x="546" y="449" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">3</text>
<text x="694" y="449" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">4</text>
<text x="842" y="449" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">5</text>
<text x="990" y="449" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="middle">6</text>
<text x="40" y="449" font-size="18" style="fill:#52637A" font-weight="400" text-anchor="start">Iteration</text>
<text x="40" y="500" font-size="20" style="fill:#172B43" font-weight="400" text-anchor="start">Slot 1</text>
<rect x="184" y="467" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="250.0" y="499.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A1</text>
<rect x="332" y="467" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="398.0" y="499.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A2</text>
<rect x="480" y="467" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="546.0" y="499.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A3</text>
<rect x="628" y="467" width="132" height="50" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="694.0" y="499.35" font-size="21" style="fill:#245EA5" font-weight="400" text-anchor="middle">A4</text>
<rect x="776" y="467" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="842.0" y="499.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<rect x="924" y="467" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="990.0" y="499.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<text x="40" y="565" font-size="20" style="fill:#172B43" font-weight="400" text-anchor="start">Slot 2</text>
<rect x="184" y="532" width="132" height="50" rx="8" fill="#FCE4C4" stroke="#CFD8E3"/>
<text x="250.0" y="564.35" font-size="21" style="fill:#925000" font-weight="400" text-anchor="middle">B1</text>
<rect x="332" y="532" width="132" height="50" rx="8" fill="#FCE4C4" stroke="#CFD8E3"/>
<text x="398.0" y="564.35" font-size="21" style="fill:#925000" font-weight="400" text-anchor="middle">B2</text>
<rect x="480" y="532" width="132" height="50" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="546.0" y="564.35" font-size="21" style="fill:#18735C" font-weight="400" text-anchor="middle">C1</text>
<rect x="628" y="532" width="132" height="50" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="694.0" y="564.35" font-size="21" style="fill:#18735C" font-weight="400" text-anchor="middle">C2</text>
<rect x="776" y="532" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="842.0" y="564.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<rect x="924" y="532" width="132" height="50" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="990.0" y="564.35" font-size="21" style="fill:#52637A" font-weight="400" text-anchor="middle">idle</text>
<line x1="472" y1="456" x2="472" y2="593" stroke="#18735C" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="615" font-size="17" style="fill:#18735C" font-weight="400" text-anchor="start">C ready</text>
<text x="715" y="615" font-size="18" style="fill:#18735C" font-weight="700" text-anchor="start">C finishes two iterations earlier</text>
<text x="40" y="666" font-size="17" style="fill:#52637A" font-weight="400" text-anchor="start">Decode-only example; prefill is omitted. Idle cells mean no useful work for that slot.</text>
<text x="40" y="692" font-size="17" style="fill:#52637A" font-weight="400" text-anchor="start">Iteration widths are illustrative: real duration depends on the batch and workload.</text>
</svg>
