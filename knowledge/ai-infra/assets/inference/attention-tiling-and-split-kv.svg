<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">FlashAttention and Flash-Decoding: tiling and parallel KV splits</title>
<desc id="desc">FlashAttention processes KV tiles with an on-chip score tile and running softmax state, avoiding full intermediate matrices in HBM. Flash-Decoding partitions the KV range into four parallel workers, each using tiled attention, then merges normalized outputs with log-sum-exp weights.</desc>
<metadata>Original explanatory diagram for research-vault. References: FlashAttention, https://arxiv.org/pdf/2205.14135 ; Flash-Decoding, https://crfm.stanford.edu/2023/10/12/flashdecoding.html</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52637A"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F2F4F7"/><path d="M0,8 L8,0" stroke="#D5DDE6" stroke-width="1"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172B43} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect x="0" y="0" width="1200" height="1020" rx="0" fill="#FFFFFF" stroke="none"/>
<text x="40" y="49" font-size="30" style="fill:#172B43" font-weight="700" text-anchor="start">FlashAttention and Flash-Decoding: tiling and parallel KV splits</text>
<text x="40" y="83" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="start">One query row shown for clarity. Other query tiles, heads, and requests can also run in parallel.</text>
<line x1="40" y1="106" x2="1160" y2="106" stroke="#CFD8E3" stroke-width="2"/>
<text x="40" y="151" font-size="24" style="fill:#172B43" font-weight="700" text-anchor="start">1  FlashAttention: compute attention through tiles</text>
<text x="40" y="199" font-size="20" style="fill:#52637A" font-weight="400" text-anchor="start">K/V in HBM</text>
<rect x="236" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="284.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 1</text>
<rect x="344" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="392.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 2</text>
<rect x="452" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="500.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 3</text>
<rect x="560" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="608.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 4</text>
<rect x="668" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="716.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 5</text>
<rect x="776" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="824.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 6</text>
<rect x="884" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="932.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 7</text>
<rect x="992" y="169" width="96" height="51" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="1040.0" y="201.15" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 8</text>
<line x1="500" y1="221" x2="500" y2="263" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="520" y="250" font-size="18" style="fill:#52637A" font-weight="400" text-anchor="start">load the next tile</text>
<rect x="40" y="269" width="1120" height="181" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="61" y="304" font-size="20" style="fill:#172B43" font-weight="700" text-anchor="start">On-chip working state</text>
<rect x="61" y="329" width="152" height="58" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="137.0" y="364.65" font-size="19" style="fill:#18735C" font-weight="400" text-anchor="middle">Query row q</text>
<rect x="277" y="329" width="235" height="58" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="394.5" y="364.65" font-size="19" style="fill:#245EA5" font-weight="400" text-anchor="middle">Current score tile</text>
<rect x="574" y="329" width="317" height="58" rx="8" fill="#FCE4C4" stroke="#CFD8E3"/>
<text x="732.5" y="364.3" font-size="18" style="fill:#925000" font-weight="400" text-anchor="middle">Online-softmax state: m, ℓ, u</text>
<rect x="960" y="329" width="173" height="58" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="1046.5" y="365.0" font-size="20" style="fill:#18735C" font-weight="400" text-anchor="middle">o = u / ℓ</text>
<line x1="214" y1="358" x2="276" y2="358" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="513" y1="358" x2="573" y2="358" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="892" y1="358" x2="959" y2="358" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="935" y="413" font-size="17" style="fill:#52637A" font-weight="400" text-anchor="middle">after all tiles</text>
<text x="61" y="427" font-size="17" style="fill:#52637A" font-weight="400" text-anchor="start">m: running max  |  ℓ: normalization sum  |  u: rescaled weighted-value accumulator</text>
<text x="40" y="481" font-size="19" style="fill:#172B43" font-weight="400" text-anchor="start">Only a score tile and running state are needed; full scores and probabilities stay out of HBM.</text>
<line x1="40" y1="510" x2="1160" y2="510" stroke="#CFD8E3" stroke-width="2"/>
<text x="40" y="552" font-size="24" style="fill:#172B43" font-weight="700" text-anchor="start">2  Flash-Decoding: split the KV range into parallel work</text>
<text x="40" y="590" font-size="19" style="fill:#52637A" font-weight="400" text-anchor="start">Each worker gets the same q and a different KV range; each uses tiled attention internally.</text>
<rect x="40" y="620" width="265" height="143" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="172" y="652" font-size="20" style="fill:#172B43" font-weight="700" text-anchor="middle">Parallel worker 1</text>
<rect x="53" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="110.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 1</text>
<rect x="177" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="234.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 2</text>
<text x="172" y="740" font-size="16" style="fill:#172B43" font-weight="400" text-anchor="middle">Partial output o1, statistic L1</text>
<path d="M 172 764 V 795 H 600 V 820" fill="none" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="325" y="620" width="265" height="143" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="457" y="652" font-size="20" style="fill:#172B43" font-weight="700" text-anchor="middle">Parallel worker 2</text>
<rect x="338" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="395.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 3</text>
<rect x="462" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="519.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 4</text>
<text x="457" y="740" font-size="16" style="fill:#172B43" font-weight="400" text-anchor="middle">Partial output o2, statistic L2</text>
<path d="M 457 764 V 795 H 600 V 820" fill="none" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="620" width="265" height="143" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="742" y="652" font-size="20" style="fill:#172B43" font-weight="700" text-anchor="middle">Parallel worker 3</text>
<rect x="623" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="680.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 5</text>
<rect x="747" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="804.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 6</text>
<text x="742" y="740" font-size="16" style="fill:#172B43" font-weight="400" text-anchor="middle">Partial output o3, statistic L3</text>
<path d="M 742 764 V 795 H 600 V 820" fill="none" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="895" y="620" width="265" height="143" rx="8" fill="#F4F7FB" stroke="#CFD8E3"/>
<text x="1027" y="652" font-size="20" style="fill:#172B43" font-weight="700" text-anchor="middle">Parallel worker 4</text>
<rect x="908" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="965.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 7</text>
<rect x="1032" y="668" width="114" height="37" rx="8" fill="#D8E7FC" stroke="#CFD8E3"/>
<text x="1089.0" y="692.45" font-size="17" style="fill:#245EA5" font-weight="400" text-anchor="middle">Tile 8</text>
<text x="1027" y="740" font-size="16" style="fill:#172B43" font-weight="400" text-anchor="middle">Partial output o4, statistic L4</text>
<path d="M 1027 764 V 795 H 600 V 820" fill="none" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="233" y="824" width="735" height="62" rx="8" fill="#D4EFE6" stroke="#CFD8E3"/>
<text x="600.5" y="862.0" font-size="20" style="fill:#18735C" font-weight="400" text-anchor="middle">Merge with weights exp(Lj − L), where L = logsumexp(Lj)</text>
<line x1="600" y1="887" x2="600" y2="909" stroke="#52637A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="937" font-size="23" style="fill:#172B43" font-weight="700" text-anchor="middle">Final attention output: o = Σj exp(Lj − L) oj</text>
<text x="40" y="992" font-size="17" style="fill:#52637A" font-weight="400" text-anchor="start">KV splits partition computation; KV pages partition storage. They need not have the same boundaries.</text>
</svg>
